        <div class="form-container"> 

            <h2>Change Password</h2>
             <form id="reset-password-form">
            <div class="form-inputs">
                <div class="input-box">
                    <input type="text" class="input-field" id="username" placeholder="Username" required>
                </div>
                <div class="input-box">
                    <input type="password" class="input-field" id="new-password" placeholder="New Password" required>
                </div>
                <div class="input-box">
                    <input type="password" class="input-field" id="confirm-password" placeholder="Confirm Password" required>
                </div>
                <button type="submit" id="change-password-btn" class="input-submit">Change Password</button>
                <p id="password-message"></p>
            </div>
        </form>
        </div>



<script>
       document.getElementById("reset-password-form").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent form submission

            let username = document.getElementById("username").value.trim();
            let newPassword = document.getElementById("new-password").value.trim();
            let confirmPassword = document.getElementById("confirm-password").value.trim();
            let messageElement = document.getElementById("password-message");

            if (!username || !newPassword || !confirmPassword) {
                messageElement.innerText = "All fields are required.";
                messageElement.style.color = "red";
                return;
            }

            if (newPassword !== confirmPassword) {
                messageElement.innerText = "Passwords do not match.";
                messageElement.style.color = "red";
                return;
            }
            fetch("reset_password.php", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `username=${encodeURIComponent(username)}&newPassword=${encodeURIComponent(newPassword)}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    messageElement.style.color = "green";
                    messageElement.innerText = "Password reset successfully!";
                } else {
                    messageElement.style.color = "red";
                    messageElement.innerText = data.message;
                }
            })
            .catch(error => {
                console.error("Error:", error);
                messageElement.innerText = "An error occurred. Please try again.";
            });
        });

</script>
</body>
