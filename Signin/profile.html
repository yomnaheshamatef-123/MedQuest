    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let username = sessionStorage.getItem("username");
            if (!username) {
                window.location.href = "index.html"; // Redirect to login page if not logged in
            } else {
                document.getElementById("welcome-user").innerText = "Welcome, " + username + "!";
    
                // Fetch user data from get_user.php
                fetch("get_user.php")
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === "success") {
                            document.getElementById("profile-username").value = data.username;
                            document.getElementById("profile-name").value = data.full_name;
                            document.getElementById("profile-email").value = data.email;
                            document.getElementById("profile-faculty").value = data.faculty;
                            document.getElementById("profile-university").value = data.university;
                            document.getElementById("profile-city").value = data.city;
                            document.getElementById("profile-country").value = data.country;
                        } else {
                            console.error("User data not found!");
                        }
                    })
                    .catch(error => console.error("Error fetching user data:", error));
            }
        });
    </script>

<script>
    document.getElementById("change-password-btn").addEventListener("click", function () {
        let currentPassword = document.getElementById("current-password").value;
        let newPassword = document.getElementById("new-password").value;
        let confirmPassword = document.getElementById("confirm-password").value;
        let messageElement = document.getElementById("password-message");

        // Check if fields are empty
        if (!currentPassword || !newPassword || !confirmPassword) {
            messageElement.innerText = "All fields are required.";
            return;
        }

        // Check if new passwords match
        if (newPassword !== confirmPassword) {
            messageElement.innerText = "New passwords do not match.";
            return;
        }

        // Send password change request to the server
        fetch("change_password.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                currentPassword: currentPassword,
                newPassword: newPassword
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                messageElement.style.color = "green";
                messageElement.innerText = "Password changed successfully!";
            } else {
                messageElement.style.color = "red";
                messageElement.innerText = data.message;
            }
        })
        .catch(error => {
            console.error("Error:", error);
            messageElement.innerText = "An error occurred. Please try again.";
        });
    });
</script>
